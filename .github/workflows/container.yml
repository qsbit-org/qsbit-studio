name: Container
on:
  pull_request:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Check source pins
        run: python3 tests/check_dependencies.py
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: qsbit-studio:test
          build-args: STUDIO_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Prepare host test tools
        run: |
          python3 -m venv .venv
          .venv/bin/pip install uv==0.12.7
          .venv/bin/uv sync --frozen --group integration --group browser
          .venv/bin/python -m playwright install --with-deps chromium
      - name: Test final image without external network access
        run: .venv/bin/python tests/container_test.py --image qsbit-studio:test
      - name: Save tested image
        if: github.event_name == 'push' || github.event_name == 'release'
        run: |
          docker image inspect --format '{{.Id}}' qsbit-studio:test > tested-image-id
          docker save --output image.tar qsbit-studio:test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: github.event_name == 'push' || github.event_name == 'release'
        with:
          name: tested-image
          path: |
            image.tar
            tested-image-id
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: container-verification
          path: .local/verification/
  publish:
    needs: verify
    if: github.event_name == 'push' || (github.event_name == 'release' && !github.event.release.prerelease)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: tested-image
      - name: Load verified image
        run: |
          docker load --input image.tar
          test "$(docker image inspect --format '{{.Id}}' qsbit-studio:test)" = "$(cat tested-image-id)"
      - name: Publish verified image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          registry=ghcr.io/qsbit-org/qsbit-studio
          tags=("sha-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}")
          if [ "$EVENT_NAME" = release ]; then
            [[ "$RELEASE_TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]
            tags+=("$RELEASE_TAG" latest)
          else
            tags+=(edge)
          fi
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          for tag in "${tags[@]}"; do
            docker tag qsbit-studio:test "$registry:$tag"
            docker push "$registry:$tag"
          done
          digest="$(docker image inspect --format '{{index .RepoDigests 0}}' qsbit-studio:test)"
          echo "Published $digest" >> "$GITHUB_STEP_SUMMARY"
          docker logout ghcr.io
          anonymous_config="$(mktemp -d)"
          DOCKER_CONFIG="$anonymous_config" docker pull "$digest"
